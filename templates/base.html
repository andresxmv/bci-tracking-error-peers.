<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>{% block title %}BCI Tracking Error{% endblock %}</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    :root{--navy:#07111f;--navy2:#0b1d31;--blue:#4bb8ff;--blue2:#7fd7ff;--ink:#eaf4fb;--muted:#91a7b8;--line:rgba(148,180,203,.16);--panel:rgba(12,28,45,.78);--panel2:rgba(15,36,58,.64);--green:#50d890;--red:#ff6b7a;--amber:#ffd166;--bg:#050b12}
    *{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:radial-gradient(circle at 85% -10%,rgba(41,126,185,.18),transparent 34%),radial-gradient(circle at 12% 20%,rgba(31,99,147,.12),transparent 26%),linear-gradient(180deg,#050b12 0%,#08111b 48%,#07101a 100%);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.15;background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:46px 46px;mask-image:linear-gradient(to bottom,black,transparent 82%)}
    .topbar{background:rgba(5,12,21,.82);backdrop-filter:blur(18px);border-bottom:1px solid rgba(129,197,241,.14);color:white;padding:13px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:50}.brand{font-weight:850;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}.brand:before{content:"";width:9px;height:9px;border-radius:50%;background:#54c3ff;box-shadow:0 0 18px #54c3ff}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a{color:#dff3ff;text-decoration:none;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.07);padding:8px 11px;border-radius:10px;font-size:13px;transition:.2s}.nav a:hover{background:rgba(73,184,255,.14);border-color:rgba(73,184,255,.28)}
    .wrap{max-width:1380px;margin:0 auto;padding:18px}.card{background:linear-gradient(145deg,rgba(15,34,52,.82),rgba(9,22,36,.78));border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 18px 55px rgba(0,0,0,.16),inset 0 1px rgba(255,255,255,.025);backdrop-filter:blur(12px)}
    select,input,button{font:inherit}.control{width:100%;padding:11px 12px;border:1px solid rgba(151,188,212,.22);border-radius:10px;background:#0a1827;color:#eaf6ff;outline:none}.control:focus{border-color:#43b7ff;box-shadow:0 0 0 3px rgba(67,183,255,.11)}.btn{border:0;border-radius:10px;padding:11px 14px;background:linear-gradient(135deg,#1689d4,#46bbff);color:white;font-weight:750;cursor:pointer;text-decoration:none;display:inline-block}.btn.secondary{background:#12283d;color:#bfe9ff}
    .grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:14px}.metric{position:relative;overflow:hidden;background:linear-gradient(145deg,rgba(16,37,57,.88),rgba(10,25,40,.84));border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:inset 0 1px rgba(255,255,255,.025)}.metric:after{content:"";position:absolute;inset:auto -20% -65% 35%;height:90px;background:radial-gradient(circle,rgba(72,184,255,.12),transparent 67%)}.metric small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:750}.metric strong{display:block;margin-top:6px;font-size:22px;color:#f3fbff;letter-spacing:-.025em}.metric strong:before{content:"";display:inline-block;width:4px;height:18px;border-radius:4px;background:linear-gradient(#51c4ff,#2d8fd7);margin-right:9px;vertical-align:-2px;box-shadow:0 0 12px rgba(81,196,255,.28)}
    .table-wrap{overflow-x:auto}.risk{width:100%;border-collapse:collapse;min-width:950px}.risk th{background:rgba(30,64,91,.62);color:#b9d6e8;padding:11px 9px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--line)}.risk td{padding:12px 9px;border-bottom:1px solid rgba(148,180,203,.09);text-align:center;font-size:13px}.risk tr:hover td{background:rgba(64,161,222,.045)}.risk td:first-child{text-align:left;font-weight:650}.te{background:rgba(47,152,221,.08);color:#65c9ff;font-weight:800}.ret{color:var(--green);font-weight:750}.tag{display:inline-flex;align-items:center;font-size:10px;color:#9edcff;background:rgba(55,166,232,.1);border:1px solid rgba(70,183,249,.18);border-radius:999px;padding:3px 7px;font-weight:800}.q{display:inline-flex;width:24px;height:24px;border-radius:50%;align-items:center;justify-content:center;color:white;font-weight:800}.q1{background:#F6C900;color:#333}.q2{background:#7B94A6}.q3{background:#2F80ED}.q4{background:#D95C5C}
    .flash{padding:12px 14px;border-radius:10px;margin:10px 0}.flash.success{background:rgba(55,184,99,.12);color:#7be6a2}.flash.error{background:rgba(217,75,75,.13);color:#ff9aa2}.steps{display:grid;gap:12px}.step{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}.captcha{display:block;max-width:100%;border:1px solid var(--line);border-radius:10px;margin:10px 0}
    .mobile-cards{display:none}.mcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}.mhead{padding:12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}.mgrid{display:grid;grid-template-columns:1fr 1fr}.mcell{padding:10px 12px;border-bottom:1px solid var(--line)}.mcell:nth-child(odd){border-right:1px solid var(--line)}.mlabel{font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:800}.mval{font-size:15px;font-weight:700;margin-top:3px}canvas{max-height:340px}
    @media(max-width:720px){.topbar{padding:10px 12px}.brand{font-size:14px}.nav a{font-size:12px;padding:7px 8px}.wrap{padding:10px}.kpis{grid-template-columns:1fr}.desktop-table{display:none}.mobile-cards{display:block}.card{padding:12px}.mgrid{grid-template-columns:1fr 1fr}.metric strong{font-size:19px}}
  </style>
</head>
<body>
<header class="topbar"><div class="brand">BCI · Tracking Error Peers</div><nav class="nav"><a href="{{ url_for('dashboard') }}">Dashboard</a><a href="{{ url_for('update_quota') }}">Actualizar cuota</a></nav></header>
<main class="wrap">
{% with messages = get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}
{% block body %}{% endblock %}
</main>
</body></html>
